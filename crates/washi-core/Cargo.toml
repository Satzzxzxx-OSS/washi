[package]
name = "washi-core"
version = "1.0.0"
description = "Washi の描画と CLI（tauri 非依存）"
authors = ["kiwamizamurai"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
typst-as-lib = { version = "0.16", features = ["packages", "ureq", "typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
comrak = { version = "0.55", default-features = false }
base64 = "0.23"
typst = "0.15"
typst-layout = "0.15"
typst-ide = "0.15"
flate2 = "1.1.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
